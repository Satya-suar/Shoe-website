<article class="shoe-card">
  <div class="shoe-card-img">
    <a class="img-link" [routerLink]="['/products', product.productId]"
      [attr.aria-label]="'View ' + product.productName">
      <img [src]="imageUrl + product.productImage" [alt]="product.productName" loading="lazy">
    </a>

    <span class="stock-chip" [class.out]="!product.isStock">
      {{ product.isStock ? 'Available' : 'Out of stock' }}
    </span>

    <button type="button" class="wish-btn" [class.active]="wishlist.has(product.productId)"
      [attr.aria-pressed]="wishlist.has(product.productId)"
      [attr.aria-label]="wishlist.has(product.productId) ? 'Remove from wishlist' : 'Add to wishlist'"
      (click)="toggleWishlist()">
      <i class="bi" [class.bi-heart]="!wishlist.has(product.productId)" [class.bi-heart-fill]="wishlist.has(product.productId)"></i>
    </button>
  </div>

  <div class="shoe-card-body">
    <p class="shoe-brand">{{ product.brandName }}</p>
    <h3 class="shoe-name">
      <a [routerLink]="['/products', product.productId]">{{ product.productName }}</a>
    </h3>

    <div class="shoe-meta">
      <span>Size {{ product.size }}</span>
      <span class="dot">&bull;</span>
      <span>{{ product.color }}</span>
    </div>

    <p class="shoe-price">{{ product.price | currency:'INR' }}</p>

    <div class="shoe-actions">
      <button type="button" class="btn-cart" [class.added]="added()" [disabled]="!product.isStock" (click)="addToCart()">
        <i class="bi" [class.bi-bag-plus]="!added()" [class.bi-check2]="added()"></i>
        {{ !product.isStock ? 'Out of stock' : added() ? 'Added' : 'Add to cart' }}
      </button>

      <a class="btn-details" [routerLink]="['/products', product.productId]"
        [attr.aria-label]="'View details of ' + product.productName">
        <i class="bi bi-eye"></i>
      </a>
    </div>
  </div>
</article>
