<article class="card shoe-card h-100">

  <!-- small image -->
  <div class="shoe-card-img">
    <div class="ratio ratio-4x3">
      <a [routerLink]="['/products', product.productId]">
        <img [src]="imageUrl + product.productImage" [alt]="product.productName" loading="lazy">
      </a>
    </div>

    <span class="stock-chip" [class.out]="!product.isStock">
      <span class="stock-dot"></span>
      {{ product.isStock ? 'In stock' : 'Sold out' }}
    </span>

    <button type="button" class="wish-btn" [class.active]="wishlist.has(product.productId)"
      aria-label="Wishlist" (click)="toggleWishlist()">
      <i class="bi" [class.bi-heart]="!wishlist.has(product.productId)"
        [class.bi-heart-fill]="wishlist.has(product.productId)"></i>
    </button>
  </div>

  <div class="card-body d-flex flex-column">
    <p class="shoe-brand">{{ product.brandName }}</p>
    <h3 class="shoe-name">
      <a [routerLink]="['/products', product.productId]">{{ product.productName }}</a>
    </h3>

    <!-- size badge + colour icon badge -->
    <div class="d-flex flex-wrap gap-2 mb-3">
      <span class="tag"><i class="bi bi-rulers"></i> {{ product.size }}</span>
      <span class="tag tag-icon" [title]="product.color" [attr.aria-label]="'Color: ' + product.color">
        <i class="bi bi-palette-fill"></i>
      </span>
    </div>

    <!-- price + buttons -->
    <div class="mt-auto">
      <p class="shoe-price">{{ product.price | currency:'INR':'symbol':'1.0-2' }}</p>

      <div class="row g-2 flex-nowrap">
        <div class="col">
          <button type="button" class="btn-cart w-100" [class.added]="added()"
            [disabled]="!product.isStock" (click)="addToCart()">
            <i class="bi" [class.bi-bag-plus]="!added()" [class.bi-check2]="added()"></i>
            {{ !product.isStock ? 'Out of stock' : added() ? 'Added' : 'Add to cart' }}
          </button>
        </div>
        <div class="col-auto">
          <a class="btn-eye" [routerLink]="['/products', product.productId]" aria-label="View details">
            <i class="bi bi-eye"></i>
          </a>
        </div>
      </div>
    </div>
  </div>
</article>
