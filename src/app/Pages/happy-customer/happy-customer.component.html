<section class="section happy-customer">
  <div class="container">
    <div class="section-head">
      <p class="eyebrow">Word on the street</p>
      <h2 class="section-title">Happy customers</h2>
    </div>

    <div class="row g-3 g-lg-4">
      @for (customer of customers; track customer.name; let i = $index) {
        <div class="col-12 col-md-6 col-lg-4" appReveal [revealDelay]="i * 120">
          <div class="card customer-card h-100">
            <div class="quote-mark"><i class="bi bi-quote"></i></div>
            <p class="review-text">{{ customer.review }}</p>

            <div class="rating">
              @for (star of stars; track star) {
                <i class="bi" [class.bi-star-fill]="star <= customer.rating" [class.bi-star]="star > customer.rating"></i>
              }
              <span class="rating-number">{{ customer.rating }}/5</span>
            </div>

            <div class="customer-info mt-auto">
              <img [src]="customer.image" [alt]="customer.name" class="customer-avatar" loading="lazy">
              <div>
                <p class="customer-name">{{ customer.name }}</p>
                <p class="customer-time"><i class="bi bi-clock"></i> {{ customer.postedAgo }}</p>
              </div>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
